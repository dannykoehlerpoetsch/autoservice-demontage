name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Manuell auslösbar; läuft dieselben vier Jobs auf dem gewählten Branch.
  workflow_dispatch:

permissions:
  contents: read

# Ein neuer Push auf demselben Branch macht den laufenden Vorgänger überflüssig.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

# Action-Versionen auf dem Stand mit Node-24-Laufzeit: actions/checkout@v7,
# actions/upload-artifact@v7 und actions/download-artifact@v7. Die vorherigen Major-
# Stufen liefen auf Node 20 und warnten im Log. An den Auslösern dieses Workflows
# (pull_request, push, workflow_dispatch) ändern die Major-Sprünge nichts – die
# blockierte Fork-Auswahl von checkout@v7 betrifft nur pull_request_target.

jobs:
  # ── Stufe 1: billig und schnell – Tippen, Typen, Format ────────────────────────
  quality:
    name: Lint, Typen & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # setup-bun cached die Bun-Binärdatei selbst; ein Input `cache` existiert nicht.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Format check
        run: bun run fmt:check

  # ── Stufe 2: Logik und Komponenten, inkl. Abdeckungsbericht ────────────────────
  unit:
    name: Unit-Tests & Abdeckung
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # setup-bun cached die Bun-Binärdatei selbst; ein Input `cache` existiert nicht.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests with coverage
        run: bun run test:coverage

      # Zahlen auf der PR-Seite statt nur im Log: die Deckung erscheint in der
      # Lauf-Zusammenfassung des Checks, ohne dass jemand Artefakte entpacken muss.
      - name: Deckung in die Lauf-Zusammenfassung
        if: always()
        run: |
          node -e 'const t = require("./coverage/coverage-summary.json").total; const f = (k) => t[k].pct + " %"; console.log("### Testabdeckung"); console.log(""); console.log("| Kennzahl | Wert |"); console.log("| --- | --- |"); console.log("| Statements | " + f("statements") + " |"); console.log("| Branches | " + f("branches") + " |"); console.log("| Funktionen | " + f("functions") + " |"); console.log("| Zeilen | " + f("lines") + " |");' >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage-Bericht sichern
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # ── Stufe 3: Production-Build – einmal, für alle nachfolgenden Jobs ───────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # setup-bun cached die Bun-Binärdatei selbst; ein Input `cache` existiert nicht.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - name: Build-Artefakt weitergeben
        uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: .next/
          retention-days: 1
          # Artefakte dürfen nicht über Job-Grenzen hinweg verschwindeln.
          include-hidden-files: true

  # ── Stufe 4: echte Browserstrecke + Barrierefreiheit ───────────────────────────
  e2e:
    name: E2E & Barrierefreiheit
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # setup-bun cached die Bun-Binärdatei selbst; ein Input `cache` existiert nicht.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production-Build holen
        uses: actions/download-artifact@v7
        with:
          name: next-build
          path: .next

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests (funktional + axe)
        run: bun run test:e2e

      - name: Playwright-Report sichern
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
